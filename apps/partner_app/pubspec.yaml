name: partner_app
description: SPORTO Partner Mobile Application (Organizers & Venue Owners)
version: 1.0.0+1
publish_to: none

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  core:
    path: ../../packages/core
  ui_kit:
    path: ../../packages/ui_kit
  shared_domain:
    path: ../../packages/shared_domain
  partner_data:
    path: ../../packages/partner_data
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  confetti: ^0.8.0
  go_router: ^14.8.1
  file_picker: ^8.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/
