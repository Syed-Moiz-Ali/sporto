org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Built-in Kotlin avoids plugins applying the Kotlin Gradle Plugin (e.g. flutter_image_compress_common)
android.builtInKotlin=true
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# Work around Kotlin incremental-cache failures when project and Pub cache live on different Windows drives
kotlin.incremental=false
