name: ui_kit
description: SPORTO Glassmorphism Design System & UI Kit Package
version: 1.0.0
publish_to: none

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_domain:
    path: ../shared_domain
  google_fonts: ^6.1.0
  confetti: ^0.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  fonts:
    - family: Space Grotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Variable.ttf
    - family: Quicksand
      fonts:
        - asset: assets/fonts/Quicksand-Variable.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
    - family: Mulish
      fonts:
        - asset: assets/fonts/Mulish-Variable.ttf
