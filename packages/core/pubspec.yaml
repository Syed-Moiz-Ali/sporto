name: core
description: Core infrastructure package for SPORTO (Hive, Network, SyncQueue, ConnectivityBloc, Auth)
version: 1.0.0
publish_to: none

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_domain:
    path: ../shared_domain
  flutter_bloc: ^8.1.3
  connectivity_plus: ^6.0.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  dio: ^5.4.1
  equatable: ^2.0.5
  confetti: ^0.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.8
  hive_generator: ^2.0.1
