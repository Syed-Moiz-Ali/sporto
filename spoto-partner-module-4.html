<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Spoto Partner Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0A0E12; --ink2:#12181F; --ink3:#1B232C;
    --turf:#1E8A4C; --turf-deep:#0F5C31;
    --amber:#F4B41A; --amber-deep:#8a6a10;
    --live:#E23744; --line:#232C36; --dim:#7C8894;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    background:#000; font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased;
  }
  .display{ font-family:'Anton',sans-serif; letter-spacing:.02em; }
  .mono{ font-family:'Roboto Mono',monospace; }
  .app-wrap{ min-height:100vh; display:flex; justify-content:center; }
  .phone{
    width:100%; max-width:430px; min-height:100vh; background:var(--ink);
    position:relative; padding-bottom:78px;
  }
  .topbar{ padding:16px 16px 4px; display:flex; align-items:center; justify-content:space-between; }
  .brand{ font-size:10px; letter-spacing:.15em; text-transform:uppercase; color:var(--amber); font-weight:700; }
  .h1{ color:#fff; font-size:18px; font-weight:700; }
  .h1.big{ font-size:22px; }
  .sub{ color:var(--dim); font-size:11px; }
  .content{ padding:16px; padding-top:8px; }
  .row{ display:flex; align-items:center; }
  .between{ justify-content:space-between; }
  .gap2{ gap:8px; } .gap3{ gap:12px; }
  .mb2{ margin-bottom:8px; } .mb3{ margin-bottom:12px; } .mb4{ margin-bottom:16px; }
  .mt2{ margin-top:8px; } .mt3{ margin-top:12px; } .mt4{ margin-top:16px; }

  .card{
    background:var(--ink2); border:1px solid var(--line); border-radius:16px; padding:14px;
  }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }

  .btn{
    border:none; border-radius:12px; font-weight:700; font-size:12px; cursor:pointer;
    padding:10px 14px; display:inline-flex; align-items:center; justify-content:center; gap:6px;
  }
  .btn-amber{ background:var(--amber); color:#1a1200; }
  .btn-turf{ background:var(--turf); color:#fff; }
  .btn-ghost{ background:var(--ink3); color:#fff; }
  .btn-outline-live{ background:var(--ink3); color:var(--live); }
  .btn-block{ width:100%; }
  .btn-round{
    width:36px; height:36px; border-radius:999px; display:flex; align-items:center; justify-content:center;
    background:var(--ink2); border:none; cursor:pointer;
  }
  .btn-round.amber{ background:var(--amber); }

  .badge{
    display:inline-flex; align-items:center; gap:4px; font-weight:700; font-size:9px;
    text-transform:uppercase; letter-spacing:.03em; border-radius:999px; padding:3px 8px;
  }
  .badge-mega{ background:rgba(244,180,26,.18); color:var(--amber); }
  .badge-local{ background:rgba(30,138,76,.18); color:var(--turf); }

  .status{ font-weight:700; font-size:9px; text-transform:uppercase; border-radius:999px; padding:3px 8px; }
  .status-pending{ background:rgba(244,180,26,.15); color:var(--amber); }
  .status-approved{ background:rgba(30,138,76,.15); color:var(--turf); }
  .status-live{ background:rgba(226,55,68,.15); color:var(--live); }
  .status-done{ background:rgba(124,136,148,.15); color:var(--dim); }

  .stat-label{ font-size:10px; color:var(--dim); }
  .stat-value{ font-size:18px; font-weight:700; color:#fff; }
  .stat-value.amber{ color:var(--amber); }
  .stat-value.turf{ color:var(--turf); }

  .list-item{ display:flex; align-items:center; justify-content:space-between; padding:8px 0; border-top:1px solid var(--line); }
  .list-item:first-child{ border-top:none; }

  .progress{ width:100%; height:6px; border-radius:999px; background:var(--ink3); overflow:hidden; }
  .progress > div{ height:100%; }

  .bottom-nav{
    position:fixed; bottom:0; left:0; right:0; margin:0 auto; max-width:430px;
    background:var(--ink2); border-top:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-around; padding:10px 0;
  }
  .nav-item{
    background:none; border:none; cursor:pointer; display:flex; flex-direction:column;
    align-items:center; gap:2px; color:var(--dim); padding:2px 10px;
  }
  .nav-item.active{ color:var(--amber); }
  .nav-item span{ font-size:9px; font-weight:600; }

  .field-label{ font-size:11px; color:var(--dim); margin-bottom:4px; }
  .field{
    background:var(--ink2); border:1px solid var(--line); border-radius:12px;
    padding:11px 12px; display:flex; align-items:center; gap:8px; color:var(--dim); font-size:12px;
    transition:border-color .2s ease, box-shadow .2s ease;
  }
  .field:focus-within{ border-color:var(--amber); box-shadow:0 0 0 3px rgba(244,180,26,.12); }

  .login-wrap{
    position:fixed; inset:0; max-width:430px; margin:0 auto; z-index:50; overflow-y:auto;
    background:radial-gradient(circle at 15% -5%, rgba(30,138,76,.16) 0%, transparent 45%),
               radial-gradient(circle at 100% 0%, rgba(244,180,26,.14) 0%, transparent 40%),
               var(--ink);
    padding:60px 24px 32px;
  }
  .login-crest{
    width:56px; height:56px; border-radius:16px; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(155deg, var(--amber), #B8830E); box-shadow:0 14px 30px rgba(244,180,26,.28);
    margin-bottom:16px; animation:splashPop .5s cubic-bezier(.22,1,.36,1) both;
  }
  .trust-strip{
    display:flex; align-items:center; gap:8px; margin-top:26px; padding:10px 12px; border-radius:12px;
    background:rgba(30,138,76,.08); border:1px solid rgba(30,138,76,.25);
  }

  .stepper{ display:flex; align-items:center; gap:4px; padding:0 16px; margin-bottom:16px; }
  .step-dot{
    width:24px; height:24px; border-radius:999px; display:flex; align-items:center; justify-content:center;
    font-size:10px; font-weight:700; background:var(--ink3); color:var(--dim); flex-shrink:0;
  }
  .step-dot.active{ background:var(--amber); color:#1a1200; }
  .step-line{ flex:1; height:2px; background:var(--ink3); }
  .step-line.active{ background:var(--amber); }

  .sticky-footer{
    position:fixed; bottom:0; left:0; right:0; margin:0 auto; max-width:430px;
    background:var(--ink); border-top:1px solid var(--line); padding:16px; display:flex; gap:12px;
  }

  .tier-select{
    border-radius:16px; padding:16px; text-align:left; cursor:pointer; border:1px solid var(--line); background:var(--ink2);
  }
  .tier-select.sel-local{ background:rgba(30,138,76,.15); border-color:var(--turf); }
  .tier-select.sel-mega{ background:rgba(244,180,26,.15); border-color:var(--amber); }

  .venue-row .field{ flex:1; padding:0 12px; }
  .venue-input{
    background:transparent; border:none; outline:none; color:#fff; font-size:12px;
    flex:1; padding:11px 0; font-family:'Inter',sans-serif;
  }
  .venue-input::placeholder{ color:var(--dim); }
  .remove-venue{
    width:34px; height:34px; border-radius:10px; background:var(--ink3); border:none;
    display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--live); flex-shrink:0;
  }

  .avatar{
    width:36px; height:36px; border-radius:999px; background:var(--ink3); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700;
  }

  .icon{ width:16px; height:16px; flex-shrink:0; }
  .fade-in{ animation:fadeIn .25s ease; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  /* ===== Splash & Onboarding ===== */
  .splash{
    position:fixed; inset:0; max-width:430px; margin:0 auto; z-index:50;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:radial-gradient(circle at 50% 30%, #16210f 0%, var(--ink) 65%);
    overflow:hidden; text-align:center; padding:32px;
  }
  .splash::before, .splash::after{
    content:''; position:absolute; border-radius:999px; filter:blur(2px); opacity:.18;
  }
  .splash::before{ width:280px; height:280px; background:var(--turf); top:-90px; left:-70px; }
  .splash::after{ width:220px; height:220px; background:var(--amber); bottom:-80px; right:-60px; }
  .splash-crest{
    width:84px; height:84px; border-radius:22px; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(155deg, var(--amber), #B8830E);
    box-shadow:0 0 0 1px rgba(244,180,26,.35), 0 18px 40px rgba(244,180,26,.25);
    animation:splashPop .7s cubic-bezier(.22,1,.36,1) both;
    position:relative; z-index:1;
  }
  .splash-word{
    font-family:'Anton',sans-serif; letter-spacing:.03em; color:#fff; font-size:30px;
    margin-top:20px; opacity:0; animation:splashRise .6s ease .35s forwards; position:relative; z-index:1;
  }
  .splash-word span{ color:var(--amber); }
  .splash-tag{
    font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:var(--dim); margin-top:8px;
    opacity:0; animation:splashRise .6s ease .55s forwards; position:relative; z-index:1;
  }
  .splash-loader{
    margin-top:44px; display:flex; gap:6px; opacity:0; animation:splashRise .6s ease .8s forwards; position:relative; z-index:1;
  }
  .splash-loader span{
    width:7px; height:7px; border-radius:999px; background:var(--turf); animation:splashDot 1.1s ease infinite;
  }
  .splash-loader span:nth-child(2){ animation-delay:.15s; background:var(--amber); }
  .splash-loader span:nth-child(3){ animation-delay:.3s; background:#5B8DEF; }
  @keyframes splashPop{ 0%{opacity:0; transform:scale(.5) rotate(-8deg);} 100%{opacity:1; transform:scale(1) rotate(0);} }
  @keyframes splashRise{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
  @keyframes splashDot{ 0%,80%,100%{transform:scale(.6); opacity:.4;} 40%{transform:scale(1); opacity:1;} }
  @keyframes transitionGlow{ 0%,100%{box-shadow:0 0 0 1px rgba(244,180,26,.35), 0 18px 40px rgba(244,180,26,.25);} 50%{box-shadow:0 0 0 6px rgba(244,180,26,.18), 0 22px 60px rgba(244,180,26,.4);} }

  .splash.onb-mode{ align-items:stretch; justify-content:flex-start; padding-top:64px; }
  .onb-slide{ animation:fadeIn .4s ease; position:relative; z-index:1; text-align:left; width:100%; max-width:300px; }
  .onb-progress{ display:flex; gap:8px; justify-content:center; margin-top:26px; position:relative; z-index:1; }
  .onb-pdot{ width:8px; height:8px; border-radius:999px; border:1.5px solid var(--ink3); background:transparent; transition:all .25s ease; cursor:pointer; }
  .onb-pdot.done{ background:var(--turf); border-color:var(--turf); }
  .onb-pdot.active{ background:var(--amber); border-color:var(--amber); transform:scale(1.3); }
  .splash-skip{
    position:absolute; top:20px; right:20px; z-index:2; background:none; border:none; color:var(--dim);
    font-size:11px; font-weight:600; cursor:pointer;
  }
  .onb-back{
    position:absolute; top:16px; left:16px; z-index:2; background:var(--ink2); border:1px solid var(--line); border-radius:999px;
    width:30px; height:30px; display:flex; align-items:center; justify-content:center; color:var(--dim); cursor:pointer;
  }
  .floatcard{
    background:var(--ink2); border:1px solid var(--line); border-radius:14px; padding:9px 13px; font-size:10px; font-weight:800;
    color:#fff; box-shadow:0 12px 26px rgba(0,0,0,.4); display:inline-flex; align-items:center; gap:5px; white-space:nowrap;
  }
</style>
</head>

/* Work out which knockout rounds are needed directly from the number of teams entered. */
function bracketStagesForTeams(teams){
  const n = Math.max(2, Number(teams) || 0);
  const sizes = [2,4,8,16,32,64,128,256,512,1024];
  let bracketSize = 1024;
  for(const s of sizes){ if(n<=s){ bracketSize = s; break; } }
  const thresholds = { roundof1024:1024, roundof512:512, roundof256:256, roundof128:128, roundof64:64, roundof32:32, quarterfinals:8, semifinals:4, finals:2 };
  const map = {};
  Object.keys(thresholds).forEach(k => { map[k] = bracketSize >= thresholds[k]; });
  return { map, bracketSize };
}
function applyAutoStages(){
  const knockoutTeams = state.matchStructure === 'league' ? state.leagueAdvanceTeams : state.totalTeams;
  const { map } = bracketStagesForTeams(knockoutTeams);
  state.venueStages.forEach(stage => { stage.enabled = !!map[stage.key]; });
}

function to12h(t){
  let [h,m] = t.split(':').map(Number);
  const ap = h>=12 ? 'PM' : 'AM';
  h = h % 12; if(h===0) h = 12;
  return h+':'+String(m).padStart(2,'0')+' '+ap;
}
function computeMegaMatchSchedule(){
  const schedule = [];
  const perMatchMins = Number(state.matchFormat.duration) + Number(state.matchFormat.bufferTime);
  state.venueStages.filter(s=>s.enabled).forEach(stage => {
    stage.venues.filter(v=>v.name && v.name.trim()).forEach(venue => {
      const count = Number(venue.maxMatches) || 0;
      if(!count) return;
      let [h,m] = (venue.matchTime || '08:00').split(':').map(Number);
      for(let i=1; i<=count; i++){
        const timeStr = String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
        schedule.push({
          stageLabel: stage.label, stageEmoji: stage.emoji,
          venueName: venue.name, venueLocation: venue.location,
          date: venue.matchDate || state.megaSched.start,
          time: to12h(timeStr),
          matchLabel: stage.label+' · Match '+i,
        });
        m += perMatchMins;
        while(m>=60){ m-=60; h++; }
      }
    });
  });
  return schedule;
}

function megaSubmitSchedule(){
  const s = state.megaSched;
  if(s.end < s.start){ alert('End Date must be on or after Start Date.'); return; }
  const anyVenueFilled = state.venueStages.some(stage => stage.enabled && stage.venues.some(v => v.name && v.name.trim()));
  if(!anyVenueFilled){ alert('Add at least one venue to a knockout round before submitting.'); return; }
  state.megaMatchSchedule = computeMegaMatchSchedule();
  state.megaVenueStatus='pending'; megaGo('venuePending');
}

        transform="rotate(-90 ${size/2} ${size/2})" style="transition:stroke-dasharray .6s ease;"/>
      <text x="${size/2}" y="${size/2 - 2}" text-anchor="middle" font-family="'Roboto Mono',monospace" font-size="${size*0.2}" font-weight="700" fill="#fff">${Math.round(pct)}%</text>

function tournamentInsightCard(t){
  const feeTarget = t.maxTeams * t.entryFee;
  const feeCollected = t.teams * t.entryFee;
  const feePct = feeTarget ? (feeCollected / feeTarget) * 100 : 0;
  const teamsPct = t.maxTeams ? (t.teams / t.maxTeams) * 100 : 0;
  const compPct = t.totalMatches ? (t.matchesDone / t.totalMatches) * 100 : 0;
  const compColor = t.status === 'live' ? 'var(--live)' : compPct >= 100 ? 'var(--turf)' : 'var(--dim)';
  const countdown = t.startsInDays === 0
    ? `<span style="color:var(--live);font-weight:800;">LIVE NOW</span>`
    : t.startsInDays === 1
      ? `<span style="color:var(--amber);font-weight:800;">Starts tomorrow</span>`
      : `<span style="color:#fff;font-weight:800;">${t.startsInDays}</span> <span style="color:var(--dim);">days to start</span>`;
  return `
  <div class="card" style="min-width:290px;flex-shrink:0;cursor:pointer;" onclick="openMonitor('${t.id}')">
    <div class="row between mb2">
      ${tierBadge(t.tier)}
      <span style="font-size:10px;">${countdown}</span>
    </div>
    <div style="font-size:12px;font-weight:700;color:#fff;margin-bottom:12px;">${t.name}</div>

    <div class="row" style="justify-content:space-around;margin-bottom:12px;">
      ${ringChart(compPct, compColor, 78, 'Tournament', `${t.matchesDone}/${t.totalMatches} matches`)}
      ${ringChart(teamsPct, 'var(--turf)', 78, 'Teams Enrolled', `${t.teams}/${t.maxTeams}`)}
      ${ringChart(feePct, 'var(--amber)', 78, 'Fees Collected', `₹${(feeCollected/1000).toFixed(0)}K`)}
    </div>

    <div style="font-size:10px;color:var(--dim);margin-bottom:4px;" class="row between">
      <span>Registration fee collected</span>
      <span style="color:var(--amber);font-weight:700;">₹${feeCollected.toLocaleString('en-IN')} / ₹${feeTarget.toLocaleString('en-IN')}</span>
    </div>
    <div class="progress"><div style="width:${Math.min(100,feePct)}%;background:var(--amber);"></div></div>
  </div>`;
}

    <div class="row" style="justify-content:space-around;margin-top:6px;">
      ${metrics.map(m => `<div style="font-size:8px;color:var(--dim);text-align:center;max-width:80px;line-height:1.3;">${m.short}</div>`).join('')}

function tournamentMiniCard(t){
  const completionPct = t.totalMatches ? Math.round((t.matchesDone / t.totalMatches) * 100) : 0;
  const enrollPct = Math.round((t.teams / t.maxTeams) * 100);
  const feeCollected = t.teams * t.entryFee;
  const feeTarget = t.maxTeams * t.entryFee;
  const feePct = Math.round((feeCollected / feeTarget) * 100);
  const fmtMoney = (n) => n >= 100000 ? '₹' + (n/100000).toFixed(1) + 'L' : '₹' + n.toLocaleString('en-IN');

  const countdown = t.status === 'live'
    ? `<span class="row gap2" style="font-size:9px;font-weight:800;color:var(--live);">${ic.clock} LIVE NOW</span>`
    : t.startsInDays === 0
      ? `<span class="row gap2" style="font-size:9px;font-weight:800;color:var(--amber);">${ic.clock} STARTS TODAY</span>`
      : `<span class="row gap2" style="font-size:9px;font-weight:800;color:var(--amber);">${ic.clock} STARTS IN ${t.startsInDays} DAY${t.startsInDays>1?'S':''}</span>`;

  const bar = (label, pct, valueText, color) => `
    <div style="margin-top:8px;">
      <div class="row between" style="margin-bottom:3px;">
        <span style="font-size:9px;color:var(--dim);">${label}</span>
        <span style="font-size:9px;font-weight:700;color:#fff;">${valueText} · <span style="color:${color};">${pct}%</span></span>
      </div>
      <div class="progress" style="height:5px;"><div style="width:${Math.min(pct,100)}%;background:${color};"></div></div>
    </div>`;

  return `
  <div class="card">
    <div class="row between mb2">
      <div class="row gap2">${tierBadge(t.tier)}${statusChip(t.status)}</div>
      ${countdown}
    </div>
    <div style="font-size:12px;font-weight:600;color:#fff;">${t.name}</div>
    <div class="row between" style="margin-top:2px;font-size:10px;color:var(--dim);">
      <span>${t.venue}</span><span>${t.date}</span>
    </div>
    ${t.status==='live' ? bar('Tournament completion', completionPct, `${t.matchesDone}/${t.totalMatches} matches`, 'var(--live)') : ''}
    ${bar('Teams enrolled', enrollPct, `${t.teams}/${t.maxTeams}`, 'var(--turf)')}
    ${bar('Registration fee collected', feePct, `${fmtMoney(feeCollected)} of ${fmtMoney(feeTarget)}`, 'var(--amber)')}
  </div>`;
}

/* ---- Prize structure ---- */
function calcPrizeTotal(){
  return state.prizeStages.filter(p=>p.enabled).reduce((sum,p)=> sum + (Number(p.amount)||0) * p.teams, 0);
}
function togglePrizeStage(key){
  const p = state.prizeStages.find(p=>p.key===key);
  p.enabled = !p.enabled;
  render();
}
function updatePrizeAmount(key, val){
  const p = state.prizeStages.find(p=>p.key===key);
  p.amount = val;
  const totalEl = document.getElementById('prizeTotalDisplay');
  if(totalEl) totalEl.textContent = '₹' + calcPrizeTotal().toLocaleString('en-IN');
  const sumEl = document.getElementById('prizeSummaryAmount');
  if(sumEl) sumEl.textContent = '-₹' + calcPrizeTotal().toLocaleString('en-IN');
}

function prizeStageRow(p){
  const stageTotal = (Number(p.amount)||0) * p.teams;
  return `
  <div class="row between" style="padding:10px 0;border-top:1px solid var(--line);opacity:${p.enabled?1:0.5};">
    <div class="row gap2" style="flex:1;min-width:0;">
      <button onclick="togglePrizeStage('${p.key}')" style="width:20px;height:20px;border-radius:6px;border:1.5px solid ${p.enabled?'var(--amber)':'var(--line)'};background:${p.enabled?'var(--amber)':'transparent'};display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;color:#1a1200;font-size:12px;font-weight:900;">${p.enabled?'✓':''}</button>
      <div style="font-size:15px;flex-shrink:0;">${p.emoji}</div>
      <div style="min-width:0;">
        <div style="font-size:11px;font-weight:600;color:#fff;">${p.label}</div>
        ${p.teams>1?`<div style="font-size:9px;color:var(--dim);">₹${(Number(p.amount)||0).toLocaleString('en-IN')} × ${p.teams} ${p.unit||'teams'} = ₹${stageTotal.toLocaleString('en-IN')}</div>`:''}
      </div>
    </div>
    <div class="field" style="width:104px;flex-shrink:0;padding:6px 10px;">
      ${ic.rupee}<input type="number" min="0" value="${p.amount}" ${p.enabled?'':'disabled'} oninput="updatePrizeAmount('${p.key}', this.value)" class="venue-input" style="text-align:right;" />

  </div>`;
}

function renderPrizeStructure(){
  return `
  <div class="mb3">
    <div class="field-label" style="margin-bottom:2px;">Prize structure</div>
    <div style="font-size:10px;color:var(--dim);margin-bottom:8px;">Set a payout per team for each stage reached. Toggle off stages that don't apply.</div>
    <div class="card" style="padding:12px;">
      ${state.prizeStages.map(prizeStageRow).join('')}
      <div class="row between mt3" style="padding-top:10px;border-top:1px solid var(--line);">
        <span style="font-size:12px;font-weight:700;color:#fff;">Total prize pool</span>
        <span id="prizeTotalDisplay" style="font-size:15px;font-weight:700;color:var(--amber);" class="mono">₹${calcPrizeTotal().toLocaleString('en-IN')}</span>
      </div>
    </div>
  </div>`;
}

  return stage.venues.reduce((sum,v)=> sum + (Number(v.maxMatches)||0), 0);
}

function updateAllocationDisplay(stageIndex){
  const stage = state.venueStages[stageIndex];
  const allocated = venueAllocation(stage);
  const ok = allocated === stage.matchesInStage;
  const el = document.getElementById('alloc-'+stageIndex);
  if(el){
    el.textContent = allocated + '/' + stage.matchesInStage + ' allocated';
    el.style.color = ok ? 'var(--turf)' : 'var(--amber)';
  }
}

function setMatchStructure(val){
  state.matchStructure = val;
  applyAutoStages();
  render();
}

/* ---- 1. Mega list ---- */
function megaApplicationsData(){
  const apps = [];
  if(state.megaAppStatus!=='none'){
    const vs = state.megaVenueStatus;
    const regOpen = vs==='approved' && state.megaRegOpen;
    let screen, note, noteColor, action;
    if(state.megaAppStatus!=='approved'){
      screen='submitted'; note='Awaiting Spoto Admin review of your organiser application.'; noteColor='var(--dim)'; action='View Application';
    } else if(vs==='none'||vs==='draft'){
      screen='venueSelect'; note='Approved — add your venue & schedule to proceed.'; noteColor='var(--amber)'; action='Add Venue & Schedule →';
    } else if(vs==='pending'){
      screen='venuePending'; note='Venue & schedule submitted — pending admin review.'; noteColor='var(--amber)'; action='View Status';
    } else if(vs==='changes'){
      screen='venuePending'; note='Spoto Admin requested changes to your schedule.'; noteColor='#F3801C'; action='Edit Venue & Schedule';
    } else if(vs==='approved' && !regOpen){
      screen='venueApproved'; note='Venue approved — open registration to proceed.'; noteColor='var(--turf)'; action='Open Registration →';
    } else {
      screen='dashboard'; note='Ready to conduct — tap to open leg dashboard.'; noteColor='var(--turf)'; action='Open Dashboard';
    }
    apps.push({ tournament: megaTournaments[0], leg:'Hyderabad Leg 07', status: state.megaAppStatus==='approved'?'approved':'pending', screen, note, noteColor, action });
  }
  /* Demo second application to illustrate a Pending state alongside a live Approved one */
  apps.push({ tournament: megaTournaments[1], leg:'Chennai Leg 03', status:'pending', screen:null, note:'Awaiting Spoto Admin review — application not yet started for this leg.', noteColor:'var(--dim)', action:null });
  /* Demo already-approved leg so the Approved tab always has something clickable to try Add Venues. Hidden once the live application above also becomes approved (they'd otherwise share the same venue data and look duplicated). */
  if(state.megaAppStatus!=='approved'){

  const done = state.megaRoundsDone;

  const nextRound = rounds[done] ? rounds[done].round : null;
  return `

          <div class="row gap2">
            <span style="font-size:11px;font-weight:700;color:${complete?'var(--turf)':isNext?'var(--amber)':'var(--dim)'};">${r.round}</span>

          </div>

      <div style="font-size:9px;color:var(--dim);margin-top:6px;text-align:center;">Results flow in from the Referee App as each match completes.</div>`:''}
    </div>

    ${allRoundsDone ? `
    <div class="card" style="border-color:rgba(244,180,26,.4);">
      <div class="row between mb2">
        <span class="badge badge-mega">${ic.crown}FINAL</span>

        <div style="flex:1;">
          <div style="font-size:12px;font-weight:700;color:#fff;">${megaFinalMatch.teamA}</div>
          <div class="mono" style="font-size:16px;font-weight:700;color:var(--amber);">${megaFinalMatch.scoreA}</div>

/* ---- 13. Venue selection (reuses organiser's saved venues) ---- */
function megaVenuesSummaryList(){
  return state.venueStages
    .filter(s => s.enabled)
    .flatMap(s => s.venues.filter(v => v.name && v.name.trim()).map(v => ({ ...v, stageLabel: s.label, stageEmoji: s.emoji })));
}
function megaTotalMatchesNeeded(){
  return state.venueStages.filter(s=>s.enabled).reduce((sum,s)=>sum+s.matchesInStage,0);
}

  const filled = megaVenuesSummaryList();
  const totalNeeded = megaTotalMatchesNeeded();

  ${megaContextStrip()}
  <div class="content" style="padding-top:0;display:flex;flex-direction:column;gap:10px;">

    ${renderVenueStagesOnly()}

    <div class="field-label" style="margin-top:4px;">Overall leg schedule</div>
    <div class="grid2">
      <div>
        <div class="field-label">Start date</div>
        <div class="field">${ic.calendar}<input type="date" value="${state.megaSched.start}" oninput="state.megaSched.start=this.value;render();" class="venue-input" /></div>
      </div>
      <div>
        <div class="field-label">End date</div>
        <div class="field" style="${state.megaSched.end<state.megaSched.start?'border-color:var(--live);':''}">${ic.calendar}<input type="date" value="${state.megaSched.end}" oninput="state.megaSched.end=this.value;render();" class="venue-input" /></div>
      </div>
    </div>
    ${state.megaSched.end<state.megaSched.start?`<div style="font-size:10px;color:var(--live);font-weight:700;">End Date must be on or after Start Date.</div>`:''}
    <div class="grid2">
      <div>
        <div class="field-label">Daily start time</div>
        <div class="field">${ic.clock}<input type="time" value="${state.megaSched.dayStart}" oninput="state.megaSched.dayStart=this.value" class="venue-input" /></div>
      </div>
      <div>
        <div class="field-label">Daily end time</div>
        <div class="field">${ic.clock}<input type="time" value="${state.megaSched.dayEnd}" oninput="state.megaSched.dayEnd=this.value" class="venue-input" /></div>
      </div>
    </div>

    <div class="card">
      <div style="font-size:12px;font-weight:700;color:#fff;margin-bottom:8px;">Feasibility (from your Regular Tournament format)</div>
      ${row('Match duration', state.matchFormat.duration+' mins', '#fff')}
      ${row('Buffer between matches', state.matchFormat.bufferTime+' mins', '#fff')}
      ${row('Matches required', String(totalNeeded), '#fff')}
      ${row('Venues added', String(filled.length), '#fff')}
      ${(()=>{
        const perMatch = Number(state.matchFormat.duration)+Number(state.matchFormat.bufferTime);
        const multiDay = state.megaSched.end > state.megaSched.start;
        const days = multiDay?2:1;
        const [sh,sm]=state.megaSched.dayStart.split(':').map(Number); const [eh,em]=state.megaSched.dayEnd.split(':').map(Number);
        const minsPerDay = Math.max(0,(eh*60+em)-(sh*60+sm));
        const capacity = Math.floor(minsPerDay/Math.max(1,perMatch))*days*Math.max(1,filled.length);
        return capacity>=totalNeeded && totalNeeded>0
          ?`<div class="row gap2 mt2" style="color:var(--turf);font-size:11px;">${ic.check} Feasible — capacity for ${capacity} match slots vs ${totalNeeded} needed</div>`

}

function renderMegaTab(){
  const map = {
    list:screenMegaList, detail:screenMegaDetail, apply:screenMegaApply, submitted:screenMegaSubmitted,
    approved:screenMegaApproved, venueSelect:screenMegaVenueSelect,
    schedSummary:screenMegaSchedSummary, venuePending:screenMegaVenuePending, venueApproved:screenMegaVenueApproved,
    dashboard:screenMegaDashboard, teams:screenMegaTeams, teamDetail:screenMegaTeamDetail, fixtures:screenMegaFixtures,
    matchSchedule:screenMegaMatchSchedule,
    bracket:screenMegaBracket, qualified:screenMegaQualified, journey:screenMegaJourney, earnings:screenMegaEarnings,
  };
  /* Guard 1: everything past the application requires organiser approval */
  const needsApproval = ['approved','venueSelect','schedSummary','venuePending','venueApproved','dashboard','teams','teamDetail','fixtures','matchSchedule','bracket','journey','earnings'];
  if(needsApproval.includes(state.megaScreen) && state.megaAppStatus!=='approved') state.megaScreen='list';
  /* Guard 2: registration-dependent screens require venue+schedule approval AND open registration */
  const needsRegistration = ['teams','teamDetail','fixtures','matchSchedule','bracket'];
  if(needsRegistration.includes(state.megaScreen) && !(state.megaVenueStatus==='approved' && state.megaRegOpen)) state.megaScreen='dashboard';
  return (map[state.megaScreen] || screenMegaList)();
}

function goOnboardSlide(i){
  if(i<0 || i>onboardSlides.length-1) return;
  clearSplashTimer();
  state.onboardIndex = i;
  render();
  scheduleOnboardAdvance();
}
function scheduleOnboardAdvance(){
  clearSplashTimer();
  if(state.onboardIndex < onboardSlides.length-1){
    splashTimer = setTimeout(()=>{ state.onboardIndex++; render(); scheduleOnboardAdvance(); }, 3200);
  }
}
function skipOnboarding(){ clearSplashTimer(); startTransition(); }
function loginShortcut(){ clearSplashTimer(); openLogin(); }

function updatePhone(el){
  el.value = el.value.replace(/\D/g,'').slice(0,10);
  state.loginPhone = el.value;
  const btn = document.getElementById('sendOtpBtn');
  if(btn){ const ok = state.loginPhone.length===10; btn.style.opacity = ok?'1':'.45'; btn.style.pointerEvents = ok?'auto':'none'; }
}
function sendOtp(){
  if(state.loginPhone.length!==10) return;
  state.loginStep='otp';
  state.otpValue='';
  render();
  startOtpTimer();
}
function startOtpTimer(){
  clearOtpTimer();
  state.otpSecondsLeft = 30;
  otpTimerId = setInterval(()=>{
    state.otpSecondsLeft--;
    const el = document.getElementById('otpTimerText');
    if(!el){ clearOtpTimer(); return; }
    if(state.otpSecondsLeft<=0){
      clearOtpTimer();
      el.outerHTML = `<button style="background:none;border:none;color:var(--amber);font-weight:700;font-size:11px;cursor:pointer;" onclick="resendOtp()">Resend OTP</button>`;
    } else {
      el.textContent = 'Resend OTP in 0:'+String(state.otpSecondsLeft).padStart(2,'0');
    }
  }, 1000);
}
function resendOtp(){ state.otpValue=''; render(); startOtpTimer(); }
function backToPhoneStep(){ clearOtpTimer(); state.loginStep='phone'; render(); }
function updateOtp(el){
  el.value = el.value.replace(/\D/g,'').slice(0,4);
  state.otpValue = el.value;
  const btn = document.getElementById('verifyOtpBtn');
  if(btn){ const ok = state.otpValue.length===4; btn.style.opacity = ok?'1':'.45'; btn.style.pointerEvents = ok?'auto':'none'; }
}
function verifyOtp(){
  if(state.otpValue.length!==4) return;
  clearOtpTimer();
  startTransition();
}

function screenLoginPhone(){
  const valid = state.loginPhone.length===10;
  return `
  <div class="login-wrap">
    <button class="onb-back" onclick="backToOnboarding()">${ic.chevronLeft}</button>
    <div class="login-crest">${ic.trophy.replace('class="icon"','class="icon" style="width:26px;height:26px;color:#1a1200;"')}</div>
    ${onbLogoHeader()}
    <div class="display" style="font-size:26px;color:#fff;margin-top:4px;line-height:1.15;">Welcome Back,<br/>Partner.</div>
    <div style="font-size:12px;color:var(--dim);margin-top:8px;line-height:1.6;max-width:280px;">Enter your registered mobile number to receive a one-time password.</div>

    <div class="field-label" style="margin-top:30px;">Mobile number</div>
    <div class="field" style="padding:4px 12px;">

      <input type="tel" inputmode="numeric" maxlength="10" placeholder="98765 43210" value="${esc(state.loginPhone)}" oninput="updatePhone(this)" class="venue-input" style="font-size:15px;padding:12px 0;letter-spacing:.5px;" autofocus />
    </div>

    <button id="sendOtpBtn" class="btn btn-amber btn-block" style="margin-top:20px;padding:14px;font-size:13px;${valid?'':'opacity:.45;pointer-events:none;'}" onclick="sendOtp()">Send OTP ${ic.chevronRight.replace('class="icon"','class="icon" style="width:14px;height:14px;"')}</button>

    <div class="row gap2" style="margin:24px 0;align-items:center;">
      <div style="flex:1;height:1px;background:var(--line);"></div>
      <span style="font-size:10px;color:var(--dim);">or continue with</span>
      <div style="flex:1;height:1px;background:var(--line);"></div>
    </div>

    <div class="row gap2">
      <button class="btn btn-ghost" style="flex:1;gap:8px;padding:12px;">
        <span style="width:18px;height:18px;border-radius:999px;background:#fff;color:#1a1200;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0;">G</span>
        Google
      </button>
      <button class="btn btn-ghost" style="flex:1;gap:8px;padding:12px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M16.365 1.43c0 1.14-.463 2.15-1.15 2.91-.75.84-1.97 1.49-3.02 1.4-.13-1.09.44-2.24 1.14-2.96.78-.82 2.11-1.44 3.03-1.35zM20.5 17.2c-.5 1.15-1.09 2.27-1.98 3.34-.85 1.02-1.83 2.28-3.27 2.29-1.27.01-1.68-.8-3.14-.8-1.46 0-1.92.79-3.13.82-1.4.05-2.5-1.27-3.36-2.29-1.84-2.24-3.24-6.33-1.36-9.09.94-1.38 2.6-2.25 4.36-2.28 1.31-.02 2.55.88 3.35.88.8 0 2.31-1.09 3.9-.93.66.03 2.52.27 3.72 2.01-.1.06-2.22 1.3-2.2 3.86.03 3.06 2.7 4.08 2.73 4.09z"/></svg>
        Apple
      </button>
    </div>

    <div class="trust-strip">
      ${ic.check.replace('class="icon"','class="icon" style="width:16px;height:16px;color:var(--turf);flex-shrink:0;"')}
      <span style="font-size:10px;color:var(--dim);line-height:1.5;">Trusted by <b style="color:#fff;">500+ organisers</b> running professional tournaments on Spoto.</span>
    </div>

    <div style="text-align:center;margin-top:22px;font-size:11px;color:var(--dim);">
      New to Spoto? <span style="color:var(--amber);font-weight:700;cursor:pointer;" onclick="backToOnboarding()">Become a Partner</span>
    </div>
    <div style="text-align:center;margin-top:16px;font-size:9px;color:var(--dim);line-height:1.6;">
      By continuing, you agree to Spoto's <span style="color:#fff;">Terms of Service</span> and <span style="color:#fff;">Privacy Policy</span>.
    </div>
  </div>`;
}

function screenLoginOtp(){
  const valid = state.otpValue.length===4;
  const maskedPhone = '+91 '+state.loginPhone.slice(0,5)+' '+state.loginPhone.slice(5);
  return `
  <div class="login-wrap">
    <button class="onb-back" onclick="backToPhoneStep()">${ic.chevronLeft}</button>
    <div class="login-crest">${ic.lock.replace('class="icon"','class="icon" style="width:24px;height:24px;color:#1a1200;"')}</div>
    ${onbLogoHeader()}
    <div class="display" style="font-size:26px;color:#fff;margin-top:4px;">Verify OTP</div>
    <div style="font-size:12px;color:var(--dim);margin-top:8px;line-height:1.6;max-width:280px;">
      Enter the 4-digit code sent to <b style="color:#fff;">${maskedPhone}</b> ·
      <span style="color:var(--amber);font-weight:700;cursor:pointer;" onclick="backToPhoneStep()">Change</span>
    </div>

    <div class="field-label" style="margin-top:30px;">One-Time Password</div>
    <div class="field" style="padding:6px 14px;">
      ${ic.lock.replace('class="icon"','class="icon" style="width:16px;height:16px;"')}
      <input type="tel" inputmode="numeric" maxlength="4" placeholder="• • • •" value="${esc(state.otpValue)}" oninput="updateOtp(this)" class="venue-input mono" style="font-size:20px;letter-spacing:10px;padding:12px 0;" autofocus />
    </div>
    <div style="font-size:9px;color:var(--dim);margin-top:8px;">Demo OTP: <span class="mono" style="color:var(--amber);font-weight:700;">1234</span></div>

    <button id="verifyOtpBtn" class="btn btn-amber btn-block" style="margin-top:22px;padding:14px;font-size:13px;${valid?'':'opacity:.45;pointer-events:none;'}" onclick="verifyOtp()">Verify & Continue</button>

    <div style="text-align:center;margin-top:20px;font-size:11px;">
      <span id="otpTimerText" style="color:var(--dim);">Resend OTP in 0:30</span>
    </div>

    <div class="trust-strip">
      ${ic.lock.replace('class="icon"','class="icon" style="width:16px;height:16px;color:var(--turf);flex-shrink:0;"')}
      <span style="font-size:10px;color:var(--dim);line-height:1.5;">Your number is only used for account verification and secure login.</span>

function screenSplashOnboard(){
  const i = state.onboardIndex;
  const s = onboardSlides[i];
  const last = i === onboardSlides.length-1;
  const first = i === 0;
  if(!splashTimer) scheduleOnboardAdvance();
  return `
  <div class="splash onb-mode" data-onboard="1">
    ${!first?`<button class="onb-back" onclick="goOnboardSlide(${i-1})">${ic.chevronLeft}</button>`:''}
    <button class="splash-skip" onclick="skipOnboarding()">Skip</button>

    <div class="onb-slide">
      ${onbLogoHeader()}
      ${s.kicker?`<div style="font-size:10px;letter-spacing:.18em;color:var(--turf);font-weight:800;margin-bottom:6px;position:relative;z-index:1;">${s.kicker}</div>`:''}
      <div class="splash-word" style="font-size:23px;opacity:1;animation:none;white-space:pre-line;line-height:1.22;text-align:left;">${s.title}</div>
      <div style="font-size:12px;color:var(--dim);margin-top:10px;max-width:280px;line-height:1.6;text-align:left;position:relative;z-index:1;">${s.desc}</div>
      ${s.visual()}
    </div>

    <div class="onb-progress">
      ${onboardSlides.map((_,idx)=>`<div class="onb-pdot ${idx===i?'active':idx<i?'done':''}" onclick="goOnboardSlide(${idx})"></div>`).join('')}
    </div>

    <button class="btn btn-amber btn-block" style="margin-top:20px;padding:13px 20px;position:relative;z-index:1;" onclick="${last?'startTransition()':`goOnboardSlide(${i+1})`}">${s.cta}</button>
    ${s.tagline?`<div style="font-size:10px;color:var(--dim);margin-top:8px;letter-spacing:.05em;position:relative;z-index:1;">${s.tagline}</div>`:''}
    ${first?`<button style="background:none;border:none;color:var(--dim);font-size:11px;font-weight:600;margin-top:14px;position:relative;z-index:1;cursor:pointer;" onclick="loginShortcut()">LOGIN</button>`:''}
    ${last?`<button style="background:none;border:none;color:var(--dim);font-size:11px;font-weight:600;margin-top:10px;position:relative;z-index:1;cursor:pointer;" onclick="loginShortcut()">I already have an account</button>`:''}
  </div>`;
}

/* ---- Final branded transition (post-onboarding, pre-Home) ---- */
function startTransition(){
  clearSplashTimer();
  state.splashPhase='transition';
  render();
  splashTimer = setTimeout(()=>{ finishSplash(); }, 2600);
}
function finishSplash(){
  clearSplashTimer();
  state.splashPhase='done';
  render();
}
function screenSplashTransition(){
  if(!splashTimer) splashTimer = setTimeout(()=>{ finishSplash(); }, 2600);
  return `
  <div class="splash">
    <div class="splash-crest" style="animation:splashPop .6s cubic-bezier(.22,1,.36,1) both, transitionGlow 2s ease-in-out infinite;">
      ${ic.trophy.replace('class="icon"','class="icon" style="width:38px;height:38px;color:#1a1200;"')}
    </div>
    <div class="splash-word" style="font-size:34px;">SPOTO</div>
    <div class="splash-tag" style="letter-spacing:.3em;">PLAY. COMPETE. BECOME.</div>
    <div style="font-size:11px;color:#fff;font-weight:700;margin-top:26px;opacity:0;animation:splashRise .6s ease 1s forwards;position:relative;z-index:1;max-width:260px;line-height:1.6;">
      WELCOME TO THE<br/><span style="color:var(--amber);">SPOTO PARTNER NETWORK</span>
    </div>
    <div class="splash-loader" style="margin-top:30px;"><span></span><span></span><span></span></div>
  </div>`;
}

/* ---- Swipe gesture support for onboarding ---- */
(function initSwipe(){
  let touchX = null;
  document.addEventListener('touchstart', (e)=>{
    const el = e.target.closest('.splash[data-onboard="1"]');
    if(!el) return;
    touchX = e.touches[0].clientX;
  }, { passive:true });
  document.addEventListener('touchend', (e)=>{
    if(touchX===null) return;
    const dx = e.changedTouches[0].clientX - touchX;
    touchX = null;
    if(Math.abs(dx) < 40) return;
    if(dx < 0) goOnboardSlide(state.onboardIndex+1);
    else goOnboardSlide(state.onboardIndex-1);
  }, { passive:true });
})();

/* ================= RENDER ================= */
function bellButton(){
  const unread = Math.max(0, computeNotifications().length - state.notifSeen);
  return `
    <button class="btn-round" style="position:relative;" onclick="openNotifications()">
      ${ic.bell}
      ${unread>0?`<span style="position:absolute;top:2px;right:2px;width:8px;height:8px;border-radius:999px;background:var(--live);border:1.5px solid var(--ink2);"></span>`:''}
    </button>`;
}
function render(){
  const content = document.getElementById('content');
  if(state.splashPhase!=='done'){
    document.getElementById('bottomNav').style.display='none';
    content.innerHTML = state.splashPhase==='logo' ? screenSplashLogo()
      : state.splashPhase==='onboard' ? screenSplashOnboard()
      : state.splashPhase==='login' ? (state.loginStep==='otp' ? screenLoginOtp() : screenLoginPhone())
      : screenSplashTransition();
    return;
  }
  if(state.overlay==='create'){
    content.innerHTML = screenCreateWizard();
  } else if(state.overlay==='monitor'){
    content.innerHTML = screenMonitor();
  } else if(state.overlay==='joinMega'){
    content.innerHTML = screenJoinMega();
  } else if(state.overlay==='joinMegaVenue'){
    content.innerHTML = screenJoinMegaVenue();
  } else if(state.overlay==='joinMegaDone'){
    content.innerHTML = screenJoinMegaDone();
  } else if(state.overlay==='notifications'){
    content.innerHTML = screenNotifications();
  } else {
    if(state.tab==='mega'){
      content.innerHTML = `
        <div class="topbar">
          <div class="brand">Spoto</div>
          ${bellButton()}
        </div>
        <div class="fade-in">${renderMegaTab()}</div>`;
      renderNav();
      return;
    }
    let inner = '';
    if(state.tab==='home') inner = screenHome();
    else if(state.tab==='tournaments') inner = screenTournaments();
    else if(state.tab==='finance') inner = screenFinance();
    else if(state.tab==='referees') inner = screenReferees();
    content.innerHTML = `
      <div class="topbar">
        <div class="brand">Spoto</div>
        ${bellButton()}
      </div>
      ${inner}
    `;
  }
  renderNav();
}

applyAutoStages();
render();
</script>
</body>
</html>
