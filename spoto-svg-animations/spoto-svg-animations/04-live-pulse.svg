<svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
  <style>
    .ping{ animation:ping 1.4s cubic-bezier(0,0,.2,1) infinite; transform-origin:20px 20px; }
    @keyframes ping{ 0%{ transform:scale(1); opacity:.75;} 75%,100%{ transform:scale(2.4); opacity:0;} }
  </style>
  <circle class="ping" cx="20" cy="20" r="7" fill="#E23744"/>
  <circle cx="20" cy="20" r="7" fill="#E23744"/>
</svg>
