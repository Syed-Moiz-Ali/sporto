<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F4B41A"/><stop offset="100%" stop-color="#8a6a10"/>
    </linearGradient>
    <style>
      .ring1,.ring2{ animation:ringPulse 2s ease-in-out infinite; transform-origin:100px 100px; }
      .ring2{ animation-delay:.6s; }
      @keyframes ringPulse{ 0%{ opacity:.5; transform:scale(1);} 100%{ opacity:0; transform:scale(1.6);} }
      .crest{ transform-origin:100px 100px; animation:pop .6s cubic-bezier(.22,1,.36,1) both; }
      @keyframes pop{ 0%{opacity:0; transform:scale(.5) rotate(-8deg);} 100%{opacity:1; transform:scale(1) rotate(0deg);} }
      .trophy-icon{ stroke:#1a1200; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; fill:none; }
    </style>
  </defs>
  <circle class="ring2" cx="100" cy="100" r="62" fill="none" stroke="#F4B41A" stroke-width="2"/>
  <circle class="ring1" cx="100" cy="100" r="62" fill="none" stroke="#F4B41A" stroke-width="3"/>
  <g class="crest">
    <rect x="58" y="58" width="84" height="84" rx="20" fill="url(#tGrad)"/>
    <g transform="translate(80,80) scale(1.6)">
      <path class="trophy-icon" d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4Z"/>
      <path class="trophy-icon" d="M17 5h3a2 2 0 0 1 0 4h-1M7 5H4a2 2 0 0 0 0 4h1"/>
    </g>
  </g>
</svg>
