<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="amberGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F4B41A"/>
      <stop offset="100%" stop-color="#8a6a10"/>
    </linearGradient>
    <style>
      .crest{ transform-origin:100px 100px; animation:pop .7s cubic-bezier(.22,1,.36,1) both, glow 2.4s ease-in-out .7s infinite; }
      @keyframes pop{ 0%{opacity:0; transform:scale(.5) rotate(-8deg);} 100%{opacity:1; transform:scale(1) rotate(0deg);} }
      @keyframes glow{ 0%,100%{ filter:drop-shadow(0 0 0px rgba(244,180,26,0)); } 50%{ filter:drop-shadow(0 0 18px rgba(244,180,26,.65)); } }
      .crown{ stroke:#1a1200; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; fill:none; }
    </style>
  </defs>
  <g class="crest">
    <rect x="38" y="38" width="124" height="124" rx="30" fill="url(#amberGrad)"/>
    <g transform="translate(60,60) scale(3.4)">
      <path class="crown" d="m2 4 3 12h14l3-12-6 7-4-7-4 7-6-7Z"/>
      <path class="crown" d="M5 19h14"/>
    </g>
  </g>
</svg>
