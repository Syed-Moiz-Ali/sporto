<svg viewBox="0 0 120 40" xmlns="http://www.w3.org/2000/svg">
  <style>
    circle{ transform-origin:center; transform-box:fill-box; animation:dot 1.1s ease infinite; }
    circle:nth-child(1){ fill:#1E8A4C; animation-delay:0s; }
    circle:nth-child(2){ fill:#F4B41A; animation-delay:.15s; }
    circle:nth-child(3){ fill:#5B8DEF; animation-delay:.3s; }
    @keyframes dot{ 0%,80%,100%{ transform:scale(.6); opacity:.4; } 40%{ transform:scale(1); opacity:1; } }
  </style>
  <circle cx="20" cy="20" r="7"/>
  <circle cx="60" cy="20" r="7"/>
  <circle cx="100" cy="20" r="7"/>
</svg>
