<svg viewBox="0 0 260 210" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F4B41A"/><stop offset="100%" stop-color="#8a6a10"/>
    </linearGradient>
    <style>
      text{ font-family:Arial, Helvetica, sans-serif; }
      .row{ opacity:0; animation:rise .5s ease forwards; }
      .r0{ animation-delay:.1s; } .r1{ animation-delay:.5s; } .r2{ animation-delay:.9s; }
      .r3{ animation-delay:1.3s; } .r4{ animation-delay:1.7s; }
      @keyframes rise{ from{opacity:0; transform:translateX(-10px);} to{opacity:1; transform:translateX(0);} }
      .final-pulse{ animation:pulse 2s ease-in-out 2.2s infinite; transform-origin:20px 190px; }
      @keyframes pulse{ 0%,100%{ filter:drop-shadow(0 0 0 rgba(244,180,26,0)); } 50%{ filter:drop-shadow(0 0 10px rgba(244,180,26,.7)); } }
    </style>
  </defs>

  <line x1="20" y1="30" x2="20" y2="190" stroke="#1B232C" stroke-width="2"/>

  <g class="row r0">
    <circle cx="20" cy="20" r="13" fill="#1B232C"/>
    <text x="20" y="24" text-anchor="middle" font-size="10" fill="#7C8894">1</text>
    <text x="44" y="25" font-size="12" fill="#7C8894">Local Tournament</text>
  </g>
  <g class="row r1">
    <circle cx="20" cy="62" r="13" fill="#1B232C"/>
    <text x="20" y="66" text-anchor="middle" font-size="10" fill="#7C8894">2</text>
    <text x="44" y="67" font-size="12" fill="#7C8894">City Championship</text>
  </g>
  <g class="row r2">
    <circle cx="20" cy="104" r="13" fill="#1B232C"/>
    <text x="20" y="108" text-anchor="middle" font-size="10" fill="#7C8894">3</text>
    <text x="44" y="109" font-size="12" fill="#7C8894">District Championship</text>
  </g>
  <g class="row r3">
    <circle cx="20" cy="146" r="13" fill="#1B232C"/>
    <text x="20" y="150" text-anchor="middle" font-size="10" fill="#7C8894">4</text>
    <text x="44" y="151" font-size="12" fill="#7C8894">State Championship</text>
  </g>
  <g class="row r4 final-pulse">
    <circle cx="20" cy="190" r="14" fill="url(#tGrad2)"/>
    <text x="20" y="195" text-anchor="middle" font-size="13">🏆</text>
    <text x="44" y="195" font-size="12" fill="#fff" font-weight="700">National Championship</text>
  </g>
</svg>
