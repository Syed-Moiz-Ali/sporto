<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F4B41A" stop-opacity=".45"/>
      <stop offset="70%" stop-color="#F4B41A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trophyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F4B41A"/>
      <stop offset="100%" stop-color="#8a6a10"/>
    </linearGradient>
    <style>
      .glow-pulse{ animation:pulse 2.6s ease-in-out infinite; transform-origin:120px 120px; }
      @keyframes pulse{ 0%,100%{ opacity:.6; transform:scale(1);} 50%{ opacity:1; transform:scale(1.08);} }
      .ring{ animation:spin 14s linear infinite; transform-origin:120px 120px; }
      @keyframes spin{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }
      .badge{ animation:float 3.2s ease-in-out infinite; }
      .badge.b2{ animation-delay:1.6s; }
      @keyframes float{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-6px);} }
      .trophy-icon{ stroke:#1a1200; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; fill:none; }
      .badge-icon{ stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; fill:none; }
    </style>
  </defs>

  <circle class="glow-pulse" cx="120" cy="120" r="95" fill="url(#glowGrad)"/>
  <circle class="ring" cx="120" cy="120" r="82" fill="none" stroke="#F4B41A" stroke-opacity=".35" stroke-width="1.5" stroke-dasharray="4 6"/>

  <circle cx="120" cy="120" r="46" fill="url(#trophyGrad)"/>
  <g transform="translate(97,97) scale(1.9)">
    <path class="trophy-icon" d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4Z"/>
    <path class="trophy-icon" d="M17 5h3a2 2 0 0 1 0 4h-1M7 5H4a2 2 0 0 0 0 4h1"/>
  </g>

  <g class="badge b1">
    <rect x="164" y="26" width="38" height="38" rx="12" fill="#12181F" stroke="#232C36"/>
    <g transform="translate(174,36)" stroke="#1E8A4C" class="badge-icon">
      <circle cx="9" cy="9" r="8"/><circle cx="9" cy="9" r="5"/><circle cx="9" cy="9" r="1.6" fill="#1E8A4C"/>
    </g>
  </g>
  <g class="badge b2">
    <rect x="18" y="150" width="38" height="38" rx="12" fill="#12181F" stroke="#232C36"/>
    <g transform="translate(28,160)" stroke="#5B8DEF" class="badge-icon">
      <path d="M13 17v-1.6a3.2 3.2 0 0 0-3.2-3.2H3.2A3.2 3.2 0 0 0 0 15.4V17"/>
      <circle cx="6.5" cy="5.6" r="3.2"/>
    </g>
  </g>
</svg>
